<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El viaje de Semi · El ciclo de vida de las plantas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#3fae49;--green-d:#2b8a3e;--ink:#2d3a2e;--sun:#ffd23f;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#c9ecff 0%,#e8f8e0 100%);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh;padding:10px 14px;gap:10px}
header{display:flex;align-items:center;gap:12px}
.logo{font-weight:700;font-size:22px;color:var(--green-d);white-space:nowrap}
.progress{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dot{width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid #d6ecd0;display:grid;place-items:center;
  font-size:17px;cursor:pointer;transition:transform .2s;padding:0}
.dot.done{background:#d9f5d3;border-color:var(--green)}
.dot.active{background:var(--sun);border-color:#f0a500;transform:scale(1.18)}
.icon-btn{width:48px;height:48px;border-radius:50%;border:none;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 0 #d6ecd0}
main{display:grid;grid-template-columns:minmax(290px,1fr) 2.4fr;gap:14px;min-height:0}
.panel{background:var(--card);border-radius:28px;padding:22px 24px;box-shadow:0 6px 0 #d3eacd,0 12px 30px #0000000f;
  display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.step{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#6fa868;font-weight:600}
.panel h1{font-size:clamp(28px,3vw,42px);margin:0;color:var(--green-d);line-height:1.05}
.panel p{font-size:clamp(19px,1.65vw,25px);line-height:1.38;margin:0}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.listen{border:none;background:#fff3c4;color:#7a5b00;font-size:19px;font-weight:600;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #f0d77a}
.listen:active,.nav:active,.icon-btn:active{transform:translateY(3px);box-shadow:none}
.status{font-size:clamp(22px,2vw,30px);font-weight:700;color:var(--green-d)}
.say{background:#fff8d9;border-radius:20px;padding:12px 16px;font-size:clamp(18px,1.55vw,23px);line-height:1.35;border:3px dashed #ffd23f}
.say.ok{background:#e4f9df;border:3px solid var(--green)}
.say.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.04)}}
.scene{position:relative;background:#bfe6ff;border-radius:28px;overflow:hidden;box-shadow:0 6px 0 #b6d9a8,0 12px 30px #0000000f;min-height:0;display:flex;flex-direction:column}
.scene.enter{animation:enter .45s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.98)}}
.scene>svg{width:100%;height:100%;flex:1;display:block;touch-action:none;min-height:0}
.scene svg text{font-family:'Fredoka',system-ui,sans-serif}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav{font-size:22px;font-weight:700;border:none;border-radius:999px;padding:14px 30px;cursor:pointer;background:#fff;color:var(--green-d);box-shadow:0 5px 0 #cfe3c9}
.nav.next{background:var(--green);color:#fff;box-shadow:0 5px 0 #237a32;opacity:.75}
.nav.next.ready{opacity:1;animation:pulseBtn 1.1s ease-in-out infinite}
@keyframes pulseBtn{50%{transform:scale(1.07)}}
.bigstart{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font-size:clamp(26px,3vw,38px);font-weight:700;border:none;border-radius:999px;
  padding:18px 48px;background:var(--sun);color:#6b4a00;box-shadow:0 7px 0 #e0a800;cursor:pointer;animation:pulseX 1.2s ease-in-out infinite}
@keyframes pulseX{50%{transform:translateX(-50%) scale(1.07)}}
.wbar,.cbar{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 10px}
.wbtn{border:none;border-radius:20px;background:#fff;font-size:clamp(16px,1.5vw,21px);font-weight:600;padding:10px 16px;cursor:pointer;box-shadow:0 5px 0 #00000022;display:flex;align-items:center;gap:8px}
.wbtn b{font-size:30px;line-height:1}
.wbtn.on{background:var(--sun)}
.wbtn.tried::after{content:'✓';color:var(--green);font-weight:700}
/* quiz */
.quiz{flex:1;display:grid;grid-template-columns:minmax(160px,1fr) 2.6fr;gap:12px;padding:14px;min-height:0;background:linear-gradient(#d9f2ff,#eefbe9)}
.pot{background:#ffffffb0;border-radius:22px;min-height:0;display:flex}
.pot svg{width:100%;height:100%}
.cards{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:12px;min-height:0}
.card{background:#fff;border-radius:22px;border:4px solid #e3efe0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  box-shadow:0 6px 0 #d3e3cf;transition:transform .15s,background .2s;min-height:0;padding:6px}
.card:hover{transform:translateY(-3px)}
.card .emo{font-size:clamp(40px,5vw,72px);line-height:1}
.card .emo svg{width:clamp(50px,6vw,86px);height:auto}
.card .lbl{font-size:clamp(17px,1.6vw,24px);font-weight:600}
.card.right{background:#dcf7d6;border-color:var(--green);box-shadow:0 6px 0 #9ad290}
.card.right .lbl::after{content:' ✓';color:var(--green)}
.card.wrong{background:#ffe1e1;border-color:#ff8a8a;animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* svg anims */
.sway{animation:sway 4s ease-in-out infinite;transform-box:view-box}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.spin{animation:spin 26s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-10px)}}
.drift1{animation:drift 26s ease-in-out infinite alternate}
.drift2{animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translateX(110px)}}
.pulse{animation:pulseS 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulseS{50%{transform:scale(1.12)}}
.wiggle{animation:wig .5s ease-in-out;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:rotate(-9deg) scale(1.05)}75%{transform:rotate(9deg) scale(1.05)}}
.shiver{animation:shiver .14s linear infinite;transform-box:view-box}
@keyframes shiver{50%{transform:translateX(4px)}}
.flap{animation:flap .12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flap{50%{transform:scaleY(.35)}}
.nod{animation:nod 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes nod{50%{transform:rotate(8deg)}}
.popin{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes popin{from{transform:scale(0)}}
.zzz{animation:zzz 2.4s ease-in infinite}
@keyframes zzz{from{transform:translate(0,0);opacity:0}30%{opacity:1}to{transform:translate(30px,-60px);opacity:0}}
.flow{animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.tappable{cursor:pointer}
.grab{cursor:grab}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf{position:absolute;top:-30px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
.cf.emo{background:none!important;width:auto;height:auto;font-size:30px}
@keyframes fall{to{transform:translate(var(--x),112vh) rotate(var(--r))}}
@media (max-width:900px),(orientation:portrait){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .panel{max-height:40vh;padding:16px 18px;gap:10px}
  .logo{display:none}
  .dot{width:30px;height:30px;font-size:14px}
  .quiz{grid-template-columns:1fr;grid-template-rows:minmax(110px,30%) 1fr}
  .cards{grid-template-columns:repeat(4,1fr)}
  .nav{padding:12px 22px;font-size:19px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🌱 El viaje de Semi</div>
    <nav class="progress" id="progress"></nav>
    <button class="icon-btn" id="soundBtn" title="Sonido y voz">🔊</button>
  </header>
  <main>
    <section class="panel" id="panel">
      <div class="step" id="step"></div>
      <h1 id="title"></h1>
      <p id="text"></p>
      <div class="row"><button class="listen" id="listen">🔊 Escuchar</button><div class="status" id="status"></div></div>
      <div class="say" id="say" hidden></div>
    </section>
    <section class="scene" id="scene"></section>
  </main>
  <footer>
    <button class="nav prev" id="prev">◀ Atrás</button>
    <button class="nav next" id="next">Siguiente ▶</button>
  </footer>
</div>
<div id="fx"></div>

<script>
'use strict';
/* =========================================================
   Utilidades
   ========================================================= */
const NS='http://www.w3.org/2000/svg';
const W=1000,H=620;
const $=id=>document.getElementById(id);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function h(tag,attrs,parent,html){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex,f=.78){const n=parseInt(hex.slice(1),16);return `rgb(${Math.round((n>>16&255)*f)},${Math.round((n>>8&255)*f)},${Math.round((n&255)*f)})`;}
function restart(node,cls){node.classList.remove(cls);void node.getBoundingClientRect();node.classList.add(cls);}
function pt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0};}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* =========================================================
   Sonido (WebAudio) y voz (speechSynthesis)
   ========================================================= */
let actx=null,soundOn=true,started=false;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx;}
function tone(f,d=.15,type='sine',v=.15,delay=0,slide){const a=ac();if(!a||!soundOn)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
const sfx={
  pop(){tone(520,.12,'sine',.2,0,950)},
  drop(){tone(950,.16,'sine',.14,0,380)},
  good(){[523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.15,i*.09))},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.16,i*.11))},
  bad(){tone(240,.28,'square',.05,0,150)},
  gulp(){tone(300,.1,'sine',.2,0,620);tone(360,.1,'sine',.2,.13,720)},
  tap(){tone(720,.06,'triangle',.1)}
};
let voice=null,speakId=0;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function clean(t){return t.replace(/O₂/g,'oxígeno').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,'').replace(/\s+/g,' ').trim();}
function stopSpeech(){speakId++;try{speechSynthesis.cancel();}catch(e){}}
function speak(text,onend){
  const id=++speakId;
  const fallback=()=>{if(onend)setTimeout(()=>{if(id===speakId)onend();},Math.max(1800,text.length*60));};
  if(!soundOn||!('speechSynthesis' in window)){fallback();return;}
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      if(id!==speakId)return;
      const u=new SpeechSynthesisUtterance(clean(text));
      u.lang='es-ES';if(voice)u.voice=voice;u.rate=.93;u.pitch=1.15;
      let fired=false;const f=()=>{if(!fired&&id===speakId){fired=true;onend&&onend();}};
      u.onend=f;u.onerror=f;speechSynthesis.speak(u);
    },70);
  }catch(e){fallback();}
}

/* =========================================================
   Bucle de animación y contexto de cada pantalla
   ========================================================= */
let current=null,idx=0;const doneSet=new Set();
let lastT=performance.now();
function tick(t){const dt=Math.min(.05,(t-lastT)/1000);lastT=t;if(current)for(const f of current.loops.slice())f(dt,t/1000);requestAnimationFrame(tick);}
requestAnimationFrame(tick);
function makeCtx(){
  const ctx={loops:[],timers:[],completed:false};
  ctx.loop=f=>{ctx.loops.push(f);return()=>{const i=ctx.loops.indexOf(f);if(i>=0)ctx.loops.splice(i,1);};};
  ctx.after=(ms,f)=>{const id=setTimeout(()=>{if(current===ctx)f();},ms);ctx.timers.push(id);return id;};
  ctx.status=s=>{$('status').textContent=s||'';};
  ctx.say=(s,{ok=false,speakIt=true,onend}={})=>{const b=$('say');b.hidden=!s;b.textContent=s||'';b.classList.toggle('ok',ok);restart(b,'bump');
    if(s&&speakIt)speak(s,onend?()=>{if(current===ctx)onend();}:null);};
  ctx.done=msg=>{if(ctx.completed)return;ctx.completed=true;doneSet.add(idx);updateProgress();sfx.win();confetti();
    if(msg)ctx.say('🎉 '+msg,{ok:true});$('next').classList.add('ready');};
  return ctx;
}
function tween(ctx,dur,f,done,ease=t=>1-Math.pow(1-t,3)){let t=0;const stop=ctx.loop(dt=>{t+=dt/dur;if(t>=1){f(1);stop();done&&done();return;}f(ease(t));});return stop;}
function along(ctx,pts,speed,onPos,onEnd){
  const segs=[];let total=0;for(let i=1;i<pts.length;i++){const l=dist(pts[i-1],pts[i]);segs.push(l);total+=l;}
  let d=0;const stop=ctx.loop(dt=>{d+=speed*dt;if(d>=total){onPos(pts[pts.length-1]);stop();onEnd&&onEnd();return;}
    let acc=0;for(let i=0;i<segs.length;i++){if(acc+segs[i]>=d){const k=(d-acc)/(segs[i]||1);onPos({x:pts[i].x+(pts[i+1].x-pts[i].x)*k,y:pts[i].y+(pts[i+1].y-pts[i].y)*k});break;}acc+=segs[i];}});
}
function confetti(){const fx=$('fx');const cols=['#ff7eb6','#ffd23f','#5cc24a','#4fb3ff','#b388ff','#ffa94d'];const emos=['🌸','🌱','⭐','🍎','🐝','🌼'];
  for(let i=0;i<64;i++){const d=h('i',{class:'cf'},fx);d.style.left=rand(0,100)+'vw';d.style.background=cols[i%cols.length];
    d.style.animationDuration=rand(1.8,3.2)+'s';d.style.animationDelay=rand(0,.4)+'s';d.style.setProperty('--r',rand(-720,720)+'deg');d.style.setProperty('--x',rand(-90,90)+'px');
    if(i%4===0){d.textContent=emos[(i/4)%emos.length|0];d.classList.add('emo');}setTimeout(()=>d.remove(),3900);}}

/* =========================================================
   Dibujos SVG reutilizables
   ========================================================= */
const DEFS=`<defs>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#78c6ff"/><stop offset="1" stop-color="#dcf3ff"/></linearGradient>
<linearGradient id="gRain" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7f90a6"/><stop offset="1" stop-color="#c8d2dd"/></linearGradient>
<linearGradient id="gSnow" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a9bfd6"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
<linearGradient id="gHot" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff8f45"/><stop offset="1" stop-color="#ffe28a"/></linearGradient>
<linearGradient id="gSoil" x1="0" y1="180" x2="0" y2="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a5692f"/><stop offset="1" stop-color="#5f3a1b"/></linearGradient>
<linearGradient id="gGrass" x1="0" y1="420" x2="0" y2="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8ad65e"/><stop offset="1" stop-color="#58aa3a"/></linearGradient>
<radialGradient id="gSun"><stop offset="0" stop-color="#fff6a8"/><stop offset=".6" stop-color="#ffd23f"/><stop offset="1" stop-color="#ffb627"/></radialGradient>
<radialGradient id="gWater" cx=".35" cy=".35"><stop offset="0" stop-color="#c4e9ff"/><stop offset="1" stop-color="#3a9fee"/></radialGradient>
<radialGradient id="gApple" cx=".35" cy=".35"><stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#e0322f"/></radialGradient>
<radialGradient id="gGold" cx=".4" cy=".35"><stop offset="0" stop-color="#fff2a8"/><stop offset="1" stop-color="#f2b705"/></radialGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".18"/></filter>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 .4  0 1 0 0 .4  0 0 1 0 0  0 0 0 1.4 0" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="desat"><feColorMatrix id="desatM" type="saturate" values="0.2"/></filter>
<filter id="cold"><feColorMatrix type="matrix" values=".55 .1 .1 0 0  .1 .7 .15 0 .05  .1 .15 .9 0 .22  0 0 0 1 0"/></filter>
<filter id="dry"><feColorMatrix type="matrix" values=".9 .35 0 0 .06  .25 .6 0 0 .02  0 .1 .3 0 0  0 0 0 1 0"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#3fae49"/></marker>
</defs>`;
const DROP='M0,-12 C5,-4 7,2 0,7 C-7,2 -5,-4 0,-12Z';
const LEAF='M0,0 C16,-24 56,-30 84,-6 C62,20 24,22 0,0Z';

function newSvg(container,vb=`0 0 ${W} ${H}`){const svg=el('svg',{viewBox:vb,preserveAspectRatio:'xMidYMid meet'},container);svg.innerHTML=DEFS;return svg;}

function drawFace(p,cx,cy,s=1,mood='happy'){
  const g=el('g',{transform:`translate(${cx},${cy}) scale(${s})`},p);
  const st={stroke:'#3b2412','stroke-width':2.4,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'};
  const f={g,mood:null,set(m){if(m===f.mood)return;f.mood=m;g.innerHTML='';
    if(m==='sleep'){el('path',Object.assign({d:'M-12,-3 q4,4 8,0 M4,-3 q4,4 8,0'},st),g);}
    else{[-8,8].forEach(x=>{el('circle',{cx:x,cy:-3,r:3.6,fill:'#2b1a0e'},g);el('circle',{cx:x+1.2,cy:-4.4,r:1.2,fill:'#fff'},g);});
      if(m==='sad'||m==='cold')el('path',Object.assign({d:'M-13,-8 l7,-3 M13,-8 l-7,-3'},st),g);}
    el('ellipse',{cx:-14,cy:4,rx:4,ry:2.5,fill:'#ff8fa3',opacity:.65},g);el('ellipse',{cx:14,cy:4,rx:4,ry:2.5,fill:'#ff8fa3',opacity:.65},g);
    const M={happy:'M-6,4 Q0,12 6,4',sad:'M-6,10 Q0,4 6,10',neutral:'M-5,7 L5,7',cold:'M-8,8 l4,-2.5 l4,2.5 l4,-2.5 l4,2.5',sleep:'M-3,7 Q0,9 3,7'};
    if(m==='o')el('ellipse',{cx:0,cy:7,rx:3.4,ry:4.2,fill:'#7a2e1f'},g);
    else if(m==='happy')el('path',{d:'M-6.5,4 Q0,13 6.5,4 Z',fill:'#7a2e1f',stroke:'#3b2412','stroke-width':2,'stroke-linejoin':'round'},g);
    else el('path',Object.assign({d:M[m]||M.happy},st),g);}};
  f.set(mood);return f;
}
function drawSeed(p,x,y,s=1,mood='happy'){
  const o=el('g',{transform:`translate(${x},${y}) scale(${s})`},p);const g=el('g',{},o);
  el('ellipse',{cx:0,cy:0,rx:34,ry:25,fill:'#b0743a',stroke:'#6e4220','stroke-width':3},g);

/* 2 · Las raíces (arrastrar hasta el agua) */

  el('circle',{r:26,fill:'#ffffff40',stroke:'#fff','stroke-width':4,'stroke-dasharray':'7 6'},hi);el('circle',{r:12,fill:'#ffd23f',stroke:'#fff','stroke-width':3},hi);
  let hand=handHint(svg,500,330,'¡Arrastra la raíz!');

  function newBranch(){pts=[{...S}];tip={...S};

    }

    return{x,y,head,face,done:false};});

  const bee=makeBee(svg,1.15);bee.pollen.setAttribute('opacity',1);

    for(let i=trail.length-1;i>=0;i--){const p=trail[i];p.life+=dt;p.y+=22*dt;p.el.setAttribute('cx',p.x);p.el.setAttribute('cy',p.y);p.el.setAttribute('opacity',Math.max(0,1-p.life));if(p.life>1){p.el.remove();trail.splice(i,1);}}

  const top=el('g',{},svg);
  let phase='A',apple=null,hand=null,buried=0;ctx.status('🍎');
  ctx.after(900,()=>{ctx.say('Mira la flor que visitó la abeja… ¡está cambiando!');
    const petals=[...P.flower.petals.children];
    petals.forEach((pe,i)=>{const a=i*45;const fall=rand(220,280),sw=rand(10,26),spin=rand(-200,200);
      ctx.after(i*140,()=>tween(ctx,2.2,e=>{pe.setAttribute('transform',`translate(${Math.sin(e*6+i)*sw},${fall*e}) rotate(${a+spin*e})`);pe.setAttribute('opacity',1-e*e);},null,t=>t*t));});
    ctx.after(1500,()=>{P.face.g.remove();P.flower.center.style.transition='opacity .8s';P.flower.center.style.opacity=0;
      apple=drawApple(P.body,210,192,.01);const af=drawFace(apple.inner,0,6,.9,'happy');
      tween(ctx,1.2,e=>apple.o.setAttribute('transform',`translate(210,192) scale(${.01+1.29*e})`),()=>{sfx.pop();phase='B';
        ctx.say('¡La flor se ha convertido en un fruto! Toca la manzana para ver qué tiene dentro.');ctx.status('🍎 ¡Tócala!');
        hand=handHint(svg,300,250);apple.inner.classList.add('tappable');
        apple.inner.addEventListener('pointerdown',e=>{e.stopPropagation();if(phase==='B')openFruit();});});});});
  function openFruit(){
    phase='C';if(hand){hand.remove();hand=null;}apple.o.setAttribute('opacity',0);sfx.tap();
    const fa=drawApple(top,210,192,1.3);drawFace(fa.inner,0,6,.9,'o');const x0=210,y0=192,x1=440,y1=455;
    tween(ctx,1,e=>{const x=x0+(x1-x0)*e,y=y0+(y1-y0)*e-140*4*e*(1-e);fa.o.setAttribute('transform',`translate(${x},${y}) scale(1.3) rotate(${e*300})`);},()=>{
      sfx.pop();fa.o.remove();
      const halves=[-1,1].map(s=>{const o=el('g',{transform:`translate(${x1},${y1})`},top);const g=el('g',{},o);
        el('path',{d:`M0,-34 A34,34 0 0,${s>0?1:0} 0,34 Z`,fill:'#e0322f',stroke:'#b71c1c','stroke-width':3},g);
        el('path',{d:`M0,-28 A28,28 0 0,${s>0?1:0} 0,28 Z`,fill:'#fff4d6'},g);
        [-12,0,12].forEach(y=>el('ellipse',{cx:s*8,cy:y,rx:4,ry:6,fill:'#6e4220'},g));return{o,s};});
      tween(ctx,.6,e=>halves.forEach(hv=>hv.o.setAttribute('transform',`translate(${x1+hv.s*40*e},${y1+10*e}) rotate(${hv.s*55*e})`)));
      const homes=[{x:385,y:385},{x:445,y:365},{x:505,y:385}];
      ctx.say('¡Dentro del fruto hay semillas! Ahora arrastra cada semilla a un agujero para enterrarla.');ctx.status('🌰 0 / 3');
      holes.forEach(hl=>hl.ring.setAttribute('opacity',1));
      homes.forEach((hm,i)=>ctx.after(300+i*150,()=>{const w=el('g',{},svg);const sd=drawSeed(w,0,0,.62,'happy');sfx.pop();
        let dd;dd=draggable(svg,w,{x:x1,y:y1},{onDrop(p){const hole=holes.find(hl=>!hl.full&&dist(p,hl)<75);if(!hole)return false;bury(w,sd,hole,dd);return true;}});
        w.style.transition='transform .5s cubic-bezier(.3,1.6,.5,1)';requestAnimationFrame(()=>dd.set(hm));dd.setHome(hm);}));
    });
  }
  function bury(w,sd,hole,dd){
    hole.full=true;hole.ring.remove();w.style.transition='transform .3s';dd.set({x:hole.x,y:hole.y-8});
    ctx.after(320,()=>{sd.o.style.transition='transform .4s';sd.o.style.transformBox='fill-box';sd.o.style.transformOrigin='center';sd.o.style.transform='translateY(8px) scale(.6)';sd.face.set('sleep');
      ctx.after(380,()=>{const m=el('g',{transform:`translate(${hole.x},${hole.y+4})`},svg);const mi=el('g',{class:'popin'},m);
        el('path',{d:'M-50,6 Q-40,-30 0,-34 Q40,-30 50,6Z',fill:'#8b5a2b',stroke:'#5e3a1a','stroke-width':3},mi);
        [[-20,-8],[8,-18],[24,-4]].forEach(([cx,cy])=>el('circle',{cx,cy,r:3,fill:'#6e4220'},mi));
        w.remove();hole.mound=m;sfx.pop();buried++;ctx.status(`🌰 ${buried} / 3`);
        if(buried===1)ctx.say('¡A dormir, semillita! Entierra las otras dos.');
        if(buried===3)ctx.after(700,sprouts);});});
  }
  function sprouts(){ctx.say('Con un poco de agua y sol…');
    holes.forEach((hl,i)=>ctx.after(i*350,()=>{const g=el('g',{},svg);
      const st=el('path',{d:`M${hl.x},${hl.y-24} C${hl.x-6},${hl.y-50} ${hl.x+6},${hl.y-70} ${hl.x},${hl.y-92}`,stroke:'#3e9b3a','stroke-width':7,fill:'none','stroke-linecap':'round',pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1},g);
      tween(ctx,.8,e=>st.setAttribute('stroke-dashoffset',1-e),()=>{const L=[1,-1].map(s=>addLeaf(g,hl.x,hl.y-88,s,.01,-30));
        tween(ctx,.5,e=>L.forEach((l,j)=>l.setAttribute('transform',`translate(${hl.x},${hl.y-88}) scale(${j?-1:1},1) rotate(-30) scale(${.01+.42*e})`)));sfx.tap();});}));
    ctx.after(2200,()=>ctx.done('¡Las semillas ya están bajo la tierra y están naciendo plantas nuevas! El viaje vuelve a empezar.'));}
}

/* 8 · El ciclo de la vida */
function sceneCycle(sc,ctx){
  const svg=newSvg(sc);el('rect',{x:-3000,y:-3000,width:7000,height:7000,fill:'#f1fbec'},svg);
  const C={x:500,y:290},RX=320,RY=200;
  el('ellipse',{cx:C.x,cy:C.y,rx:RX,ry:RY,fill:'none',stroke:'#dff2d8','stroke-width':30},svg);
  const mini={
    semilla:g=>{el('ellipse',{cx:0,cy:30,rx:46,ry:12,fill:'#a5692f'},g);drawSeed(g,0,4,1,'sleep');},
    brote:g=>{el('ellipse',{cx:0,cy:30,rx:46,ry:12,fill:'#a5692f'},g);el('path',{d:'M0,26 C-4,8 4,-6 0,-20',stroke:'#3e9b3a','stroke-width':6,fill:'none','stroke-linecap':'round'},g);addLeaf(g,0,-16,1,.35);addLeaf(g,0,-16,-1,.35);},
    planta:g=>{el('ellipse',{cx:0,cy:34,rx:46,ry:12,fill:'#a5692f'},g);const P=makePlant(g,{x:0,gy:32,h:58,leaves:4,flower:null,roots:false,ls:.38});P.bud.setAttribute('transform','translate(0,-26) scale(.8)');P.body.removeAttribute('class');},
    flor:g=>{el('ellipse',{cx:0,cy:36,rx:46,ry:12,fill:'#a5692f'},g);el('path',{d:'M0,34 L0,-8',stroke:'#3e9b3a','stroke-width':6},g);addLeaf(g,0,16,1,.35);const f=drawFlowerHead(g,0,-14,'#ff7eb6',.55);const b=makeBee(g,.42);b.place(28,-40,-1);},
    fruto:g=>{const a=drawApple(g,0,6,1.25);drawFace(a.inner,0,6,.8,'happy');},
    tierra:g=>{el('path',{d:'M-50,32 Q-40,-14 0,-18 Q40,-14 50,32Z',fill:'#8b5a2b',stroke:'#5e3a1a','stroke-width':3},g);[[-18,12],[2,2],[20,16]].forEach(([x,y])=>el('ellipse',{cx:x,cy:y,rx:5,ry:7,fill:'#6e4220'},g));
      const l=el('g',{transform:'translate(-26,-10) rotate(-15) scale(.42)'},g);el('path',{d:LEAF,fill:'#c8a26a',stroke:'#8a6a3a','stroke-width':4},l);}
  };
  const stages=[
    {k:'semilla',n:'Semilla',t:'Todo empieza con una semilla pequeñita.'},
    {k:'brote',n:'Brote',t:'Con agua, la semilla se despierta y sale un brote con raíces.'},
    {k:'planta',n:'Planta',t:'Las raíces beben agua y las hojas atrapan el sol. ¡La planta crece y crece!'},
    {k:'flor',n:'Flor',t:'Le salen flores y las abejas las polinizan.'},
    {k:'fruto',n:'Fruto',t:'La flor se convierte en un fruto con semillas dentro.'},
    {k:'tierra',n:'A la tierra',t:'Las semillas caen a la tierra. Y cuando la planta se hace viejita, se seca y se convierte en abono para las plantas nuevas.'}
  ];
  const ang=i=>(-90+i*60)*Math.PI/180;const P=a=>({x:C.x+RX*Math.cos(a),y:C.y+RY*Math.sin(a)});
  for(let i=0;i<6;i++){const a0=ang(i)+.33,a1=ang(i+1)-.33;let d='';for(let k=0;k<=16;k++){const p=P(a0+(a1-a0)*k/16);d+=(k?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1);}
    el('path',{d,stroke:'#3fae49','stroke-width':7,fill:'none','stroke-linecap':'round','stroke-dasharray':'2 14',class:'flow','marker-end':'url(#arrow)'},svg);}
  const mid=el('g',{transform:`translate(${C.x},${C.y-8})`},svg);const sd=drawSeed(mid,0,0,1.4,'happy');sd.g.classList.add('bob');
  const mt=el('text',{y:66,'text-anchor':'middle','font-size':26,'font-weight':700,fill:'#2b8a3e'},mid);mt.textContent='¡Y vuelta a empezar!';
  const visited=new Set();ctx.status('🔄 0 / 6');
  const nodes=stages.map((s,i)=>{const p=P(ang(i));const o=el('g',{transform:`translate(${p.x},${p.y})`},svg);const g=el('g',{class:'tappable'},o);
    const ring=el('circle',{r:62,fill:'#fff',stroke:'#cfe8c8','stroke-width':6,filter:'url(#soft)'},g);mini[s.k](el('g',{},g));
    const nb=el('g',{transform:'translate(-50,-46)'},g);el('circle',{r:16,fill:'#3fae49',stroke:'#fff','stroke-width':3},nb);const nt=el('text',{y:7,'text-anchor':'middle','font-size':19,'font-weight':700,fill:'#fff'},nb);nt.textContent=i+1;
    const lb=el('text',{y:92,'text-anchor':'middle','font-size':25,'font-weight':700,fill:'#2b8a3e',stroke:'#f1fbec','stroke-width':6,'paint-order':'stroke'},g);lb.textContent=s.n;
    g.addEventListener('pointerdown',()=>{playing=false;activate(i);});return{g,ring};});
  let playing=false;
  function activate(i,onend){nodes.forEach((n,j)=>{n.ring.setAttribute('stroke',j===i?'#ffd23f':'#cfe8c8');n.ring.setAttribute('stroke-width',j===i?10:6);});
    restart(nodes[i].g,'wiggle');sfx.tap();visited.add(i);ctx.status(`🔄 ${visited.size} / 6`);
    const s=stages[i];ctx.say(`${i+1}. ${s.n}: ${s.t}`,{onend:()=>{if(onend)onend();else checkDone();}});}
  function checkDone(){if(visited.size===6)ctx.done('¡Así es el ciclo de vida de las plantas! Una semilla se hace planta, y la planta da semillas nuevas.');}
  const bar=h('div',{class:'cbar'},sc);const pb=h('button',{class:'wbtn'},bar,'<b>▶</b> Ver el ciclo');
  pb.onclick=()=>{playing=true;let i=0;const step=()=>{if(!playing||current!==ctx)return;activate(i,()=>{i++;if(i<6&&playing)ctx.after(300,step);else{playing=false;checkDone();}});};step();};
}

/* 9 · Juego final: ¿Qué necesita una planta? */
function sceneQuiz(sc,ctx){
  const wrap=h('div',{class:'quiz'},sc);const pot=h('div',{class:'pot'},wrap);const svg=newSvg(pot,'0 0 300 420');
  el('rect',{x:-500,y:-500,width:1300,height:1400,fill:'none'},svg);
  const plantG=el('g',{},svg);
  el('rect',{x:80,y:318,width:140,height:24,rx:7,fill:'#e88a5c',stroke:'#a4512b','stroke-width':4},svg);
  el('path',{d:'M92,342 L208,342 L194,410 L106,410Z',fill:'#d9774b',stroke:'#a4512b','stroke-width':4},svg);
  el('ellipse',{cx:150,cy:320,rx:60,ry:7,fill:'#6b4220'},svg);
  let stage=0;
  function drawStage(){plantG.innerHTML='';const hs=[30,62,100,138,178];
    const P=makePlant(plantG,{x:150,gy:320,h:hs[stage],leaves:[0,2,2,4,4][stage],flower:stage===4?'#ff7eb6':null,roots:false,ls:.5+stage*.07,mood:stage?'happy':'neutral'});
    if(stage===4){P.flower.o.setAttribute('transform',`translate(150,${320-hs[4]}) scale(.8)`);}restart(plantG,'popin');}
  drawStage();
  const SOIL='<svg viewBox="-52 -40 104 80"><path d="M-46,26 Q-42,-24 0,-30 Q42,-24 46,26Z" fill="#8b5a2b" stroke="#5e3a1a" stroke-width="3"/><circle cx="-20" cy="6" r="5" fill="#ffd23f"/><circle cx="16" cy="12" r="5" fill="#74c0fc"/><circle cx="0" cy="-12" r="5" fill="#ff7eb6"/><circle cx="24" cy="-4" r="4" fill="#b2f2bb"/></svg>';
  const cards=shuffle([
    {e:'☀️',n:'Sol',ok:true,m:'¡Sí! La planta necesita la luz del sol.'},
    {e:'💧',n:'Agua',ok:true,m:'¡Sí! La planta necesita agua para beber.'},
    {e:'🌬️',n:'Aire',ok:true,m:'¡Sí! La planta necesita aire.'},
    {e:SOIL,n:'Tierra',ok:true,m:'¡Sí! En la tierra están las vitaminas de la planta.'},
    {e:'🍦',n:'Helado',ok:false,m:'¡Jajaja! Las plantas no comen helado.'},
    {e:'📺',n:'Tele',ok:false,m:'¡Qué risa! Las plantas no ven la tele.'},
    {e:'🍭',n:'Chuches',ok:false,m:'¡Uy! Las chuches no son para las plantas.'},
    {e:'🧸',n:'Peluche',ok:false,m:'¡Qué gracioso! Las plantas no necesitan un peluche.'}]);
  const grid=h('div',{class:'cards'},wrap);let right=0;ctx.status('🌱 0 / 4');
  cards.forEach(c=>{const d=h('div',{class:'card',role:'button'},grid,`<div class="emo">${c.e}</div><div class="lbl">${c.n}</div>`);
    d.addEventListener('pointerdown',()=>{if(c.ok){if(c.chosen)return;c.chosen=true;d.classList.add('right');right++;stage=right;drawStage();sfx.good();ctx.status(`🌱 ${right} / 4`);
        if(right<4)ctx.say(c.m);else ctx.say(c.m,{onend:()=>ctx.done('¡Perfecto! Las plantas necesitan sol, agua, aire y tierra. ¡Ya lo sabes todo!')});}
      else{sfx.bad();restart(d,'wrong');ctx.after(700,()=>d.classList.remove('wrong'));ctx.say(c.m);}});});
}

/* 10 · Final */
function sceneFinal(sc,ctx){
  const svg=newSvg(sc);const gy=480;const S=scenery(svg,{gy});
  const rb=el('g',{opacity:.85},S.g);S.g.insertBefore(rb,S.sky.nextSibling);
  ['#ff6b6b','#ffa94d','#ffd23f','#69db7c','#4dabf7','#9775fa'].forEach((c,i)=>{const r=360-i*20;el('path',{d:`M${500-r},${gy+20} A${r},${r} 0 0 1 ${500+r},${gy+20}`,stroke:c,'stroke-width':21,fill:'none'},rb);});
  makePlant(svg,{x:150,gy,h:210,leaves:4,flower:'#b388ff',roots:false});makePlant(svg,{x:850,gy,h:230,leaves:4,flower:'#ffa94d',roots:false});
  ['#ff7eb6','#74c0fc','#ff6b6b','#ffd23f','#b388ff','#ffa94d'].forEach((c,i)=>smallFlower(svg,60+i*175,gy+70+(i%2)*40,c,50,.42));
  const m=el('g',{transform:'translate(500,215)'},svg);const mi=el('g',{class:'popin'},m);
  el('path',{d:'M-46,40 L-70,140 L-40,124 L-22,150 L-4,60Z',fill:'#4dabf7',stroke:'#1c7ed6','stroke-width':3},mi);el('path',{d:'M46,40 L70,140 L40,124 L22,150 L4,60Z',fill:'#ff6b6b',stroke:'#e03131','stroke-width':3},mi);
  el('circle',{r:84,fill:'url(#gGold)',stroke:'#d49a00','stroke-width':5,filter:'url(#soft)'},mi);el('circle',{r:68,fill:'#fff6d0',stroke:'#f2c94c','stroke-width':3},mi);
  const t1=el('text',{y:-18,'text-anchor':'middle','font-size':24,'font-weight':700,fill:'#9a6b00'},mi);t1.textContent='Pequeño';
  const t2=el('text',{y:10,'text-anchor':'middle','font-size':24,'font-weight':700,fill:'#9a6b00'},mi);t2.textContent='jardinero';
  const t3=el('text',{y:44,'text-anchor':'middle','font-size':26},mi);t3.textContent='⭐⭐⭐';
  const seed=drawSeed(svg,500,430,1.8,'happy');seed.g.classList.add('bob');
  if(started){ctx.after(400,()=>{confetti();sfx.win();});}
  const bar=h('div',{class:'cbar'},sc);const b=h('button',{class:'wbtn'},bar,'<b>🔄</b> Volver a empezar');b.onclick=()=>go(1);
}

   Contenido de las pantallas

const slides=[
  {icon:'🌰',step:'Bienvenida',title:'El viaje de Semi',auto:true,build:sceneIntro,
   text:'¡Hola! Soy Semi, una semillita. ¿Me acompañas a descubrir cómo me convierto en una planta? Pulsa “¡Empezar!”.'},
  {icon:'💧',step:'Paso 1',title:'La semilla',build:sceneSeed,
   text:'Todas las plantas empiezan siendo una semilla. Dentro hay una plantita bebé dormida. Para despertarla necesita agua. ¡Toca la nube para que llueva!'},
  {icon:'🌱',step:'Paso 2',title:'Las raíces',build:sceneRoots,
   text:'La plantita saca raíces por debajo de la tierra. Las raíces son como pajitas: ¡sirven para beber agua! Arrastra la punta de la raíz hasta cada charquito de agua.'},
  {icon:'🔍',step:'Paso 3',title:'Las partes de la planta',build:sceneParts,
   text:'Cada parte de la planta tiene un trabajo. Toca las raíces, el tallo, las hojas, la flor y el fruto para descubrirlo.'},
  {icon:'☀️',step:'Paso 4',title:'¿Cómo come una planta?',build:sceneFeed,

  {icon:'❓',step:'Juego final',title:'¿Qué necesita una planta?',build:sceneQuiz,
   text:'Toca solo las cosas que necesita una planta para vivir. ¡Cuidado, que hay trampas!'},
  {icon:'🏆',step:'¡Fin!',title:'¡Eres un pequeño jardinero!',auto:true,build:sceneFinal,
   text:'Has acompañado a Semi en todo su viaje: de semilla a planta, de flor a fruto… ¡y otra vez a semilla! ¡Enhorabuena!'}
];

/* =========================================================
   Navegación
   ========================================================= */
function updateProgress(){const pr=$('progress');pr.innerHTML='';slides.forEach((s,i)=>{const d=h('button',{class:'dot'+(i===idx?' active':'')+(doneSet.has(i)?' done':''),title:s.title},pr,s.icon);
  d.onclick=()=>{started=true;ac();go(i);};});}
function go(i){
  if(i<0||i>=slides.length)return;
  if(current){current.timers.forEach(clearTimeout);current.loops.length=0;}
  stopSpeech();idx=i;const s=slides[i];
  $('step').textContent=s.step;$('title').textContent=s.title;$('text').textContent=s.text;$('status').textContent='';$('say').hidden=true;
  const sc=$('scene');sc.innerHTML='';restart(sc,'enter');
  current=makeCtx();
  if(s.auto){current.completed=true;doneSet.add(i);}
  s.build(sc,current);updateProgress();
  $('prev').style.visibility=i?'visible':'hidden';
  $('next').style.visibility=i===0?'hidden':'visible';
  $('next').classList.toggle('ready',current.completed);
  $('next').textContent=i===slides.length-1?'🔄 Otra vez':'Siguiente ▶';
  if(started)setTimeout(()=>{if(idx===i)speak(s.title+'. '+s.text);},350);
}
$('prev').onclick=()=>{sfx.tap();go(idx-1);};
$('next').onclick=()=>{started=true;ac();sfx.tap();go(idx===slides.length-1?1:idx+1);};
$('listen').onclick=()=>{started=true;ac();const s=slides[idx];speak(s.title+'. '+s.text);};
$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇';if(!soundOn)stopSpeech();else sfx.tap();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft'&&idx>0)$('prev').click();});
go(0);
</script>
